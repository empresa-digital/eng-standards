# EXAMPLE — copy into a target repo as .github/workflows/eng-standards-pre-review.yml
#
# Automatic PR pre-review using the eng-standards pr-bot: runs the reviewer +
# architecture pass, classifies SAFE vs NEEDS_HUMAN (fail-closed), and posts one
# gate comment. Bills against the Claude *plan* (CLAUDE_CODE_OAUTH_TOKEN), NOT the
# metered API — this is the whole point vs. the old claude-review.yml.
#
# One-time setup in the target repo (owner does this):
#   1. `claude setup-token` while logged into the Max plan → copy the token.
#   2. Repo → Settings → Secrets and variables → Actions → New secret:
#        CLAUDE_CODE_OAUTH_TOKEN = <that token>
# That's the only secret: eng-standards is public, so its checkout needs no token.
# (If it ever goes private, add a read-contents PAT as ENG_STANDARDS_TOKEN and
# pass it via `token:` on that checkout step.)
#
# Calibration note: keep this in dry-run-equivalent (comment-only) mode. The bot
# comments; it never merges or approves. Promote to Phase 2 (auto-approve SAFE)
# only after its SAFE verdicts are shown to match human judgment.

name: eng-standards pre-review

on:
  pull_request:
    # ready_for_review: review a native draft when it's marked ready.
    # edited: re-check when the title changes (WIP/Draft marker removed).
    types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  # One review in flight per PR; a new push cancels the older run.
  group: eng-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Work-in-progress PRs get no review: skip GitHub-native drafts here and
    # WIP/Draft-prefixed titles in the step below. `edited` fires on BODY edits
    # too, so this guard only lets through edits that changed the title;
    # combined with the OLD_TITLE check below, a re-review happens exactly on
    # the WIP→ready title transition — body edits and cosmetic renames never
    # burn a review.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.title.from != null)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.title.outputs.go }}
    steps:
      - name: Skip WIP/Draft-prefixed titles (case-insensitive)
        id: title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          OLD_TITLE: ${{ github.event.changes.title.from }}
          ACTION: ${{ github.event.action }}
        run: |
          # Prefix-only on purpose: "WIP:", "Draft:", "[WIP]", "[Draft]" (any
          # case). A mid-title mention ("Fix wipe bug", "draft-saving feature")
          # is not a WIP marker and still gets reviewed.
          wip() { printf '%s' "$1" | grep -qiE '^[[:space:]]*((wip|draft):|\[(wip|draft)\])'; }
          if wip "$TITLE"; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Title marks the PR as WIP/Draft — review deferred until it's ready."
          elif [ "$ACTION" = edited ] && ! wip "$OLD_TITLE"; then
            # Cosmetic rename (was already reviewable): don't burn a re-review.
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pre-review:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post the gate comment
    steps:
      - name: Check out the PR repo
        uses: actions/checkout@v4
        with:
          # Full history so the throwaway worktree at the PR head resolves cleanly.
          fetch-depth: 0

      - name: Check out eng-standards (rule library + pr-bot)
        uses: actions/checkout@v4
        with:
          repository: empresa-digital/eng-standards
          path: eng-standards

      - name: Install toolchain (envsubst, pyyaml, claude CLI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext-base   # provides envsubst
          python3 -m pip install --quiet pyyaml
          npm install -g @anthropic-ai/claude-code    # provides `claude`

      - name: Run pre-review (plan-billed, fail-closed) and post the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}                       # gh pr diff/view + comment
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ENG_DIR: ${{ github.workspace }}/eng-standards              # rule library root
          REPO_DIR: ${{ github.workspace }}                           # repo under review
        run: |
          ./eng-standards/review/pr-bot/run.sh \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            --post
