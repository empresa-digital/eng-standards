meta:
  pack: org/empresa-digital
  description: >
    Rules that do NOT travel: bound to empresa-digital's stack (ksql, kbuilder, kparse,
    testtools, kpgx, Fiber) or to its house conventions. At a new company, leave these
    behind and write a new orgs/<company>.yaml. The universal + language packs carry over.
  language: en
  stack: [go, ksql, kbuilder, kparse, kpgx, fiber, testtools, vue, quasar, cypress]
  # Config read by the PR review bot (review/pr-bot) when reviewing this org's PRs.
  pr_review:
    language: pt-BR
    comment:
      title: "🤖 **Pré-revisão automática** — eng-standards · *experimental*"
      details_summary: "Revisão completa"
      safe_header: "✅ **PR considerado seguro pra merge sem revisão extra.**"
      needs_human_header: "🔴 **Requer revisão humana antes do merge.**"
      reasons_label: "Motivos:"
      footer: "_Automação em fase de testes; ainda pode gerar ruído. Feedback ajuda a calibrar._"

rules:
  - id: ed-canonical-test-command
    topic: Workflow
    severity: blocker
    lintable: false
    sources: ["agent-improvements#15,23"]
    principle: >
      Use `make test` for validation. Don't run direct `go test` with custom GOCACHE or
      hand-picked package lists.
    wrong:
      code: |
        go test ./cmd/api -run='TestFoo' # to run a specific test
        go test ./... # to run all tests
    right:
      code: |
        make test path=./cmd/api args=-run='TestFoo' # to run a specific test
        make test # to run all tests
    reason: >
      The Makefile already handles Docker/integration setup; the Go cache invalidates
      itself correctly; tests are fast. Direct toolchain invocations create sandbox
      friction.

  - id: ed-local-linter-setup
    topic: Workflow
    severity: nit
    lintable: false
    sources: ["user-2026-07"]
    principle: >
      Local linters and dev tools (go-arch-lint, staticcheck, richgo, …) are installed
      per Go module via `go install <tool>@latest` in the Makefile `setup` target, and then
      invoked from `make lint` / CI. A monorepo has one such setup per module. This is the
      mechanism the generic `go-arch-import-boundary-enforced` (packs/backend-go) rule defers
      to for wiring an import-boundary linter.
    wrong:
      description: A tool assumed to be globally present, not installed by the module's setup.
      code: |
        # Makefile
        lint: ; go-arch-lint check; staticcheck ./...; go vet ./...
        # (no setup target installs go-arch-lint / staticcheck — CI has no way to get them)
    right:
      description: The setup target installs each tool; lint runs them.
      code: |
        # Makefile
        setup:
        	go install github.com/fe3dback/go-arch-lint@latest
        	go install honnef.co/go/tools/cmd/staticcheck@latest
        lint: ; go-arch-lint check; staticcheck ./...; go vet ./...
    reason: >
      Installing tools per module via `go install <tool>@latest` in `setup` keeps CI and every
      developer on the same pinned-by-tag toolchain without a heavier lint aggregator. This is
      an empresa-digital house convention; another org may vendor tools differently, so it
      stays in the org profile and the portable backend-go rule points here for the mechanics.

  - id: ed-repo-two-version-functions
    topic: Architecture
    severity: blocker
    lintable: false
    sources: ["agent-improvements#6,25", be-039]
    principle: >
      Repository operations come in two forms: a method on the client using the injected
      `c.db`, and a public function accepting a `ksql.Provider` (transaction-friendly).
      The method delegates to the public function — never duplicate the query.
    wrong:
      code: |
        func (c *Client) CreateDocument(ctx context.Context, doc *core.Document) error {
          // full query implementation duplicated here
        }
    right:
      code: |
        func (c *Client) CreateDocument(ctx context.Context, doc *core.Document) error {
          return CreateDocument(ctx, c.db, doc)
        }
        func CreateDocument(ctx context.Context, db ksql.Provider, doc *core.Document) error {
          // single query implementation
        }
    reason: One implementation, usable both inside and outside a transaction.

  - id: ed-list-funcs-use-kbuilder-and-pagination
    topic: Repository
    severity: blocker
    lintable: false
    sources: [db-003, "agent-improvements#7"]
    principle: >
      List repository functions use `kbuilder.Query` and accept pagination
      (offset/limit) plus conditional filters via WhereIf — unless a bounded-size
      invariant is proven. Return the full result set by default and expose any
      business subset (e.g. only-latest-version, only-active) as an optional WhereIf
      filter rather than hardcoding it into the query.
    wrong:
      code: |
        query := "SELECT * FROM documents WHERE firm_id = $1"
        if filter.Kind != "" {
          query += " AND kind = $2"
          args = append(args, filter.Kind)
        }
        c.db.Query(ctx, query, args...)
    right:
      code: |
        var documents []Document
        err := c.db.QueryFromBuilder(ctx, &documents, kbuilder.Query{
          From:  "documents d",
          Where: kbuilder.Where("d.firm_id = %s", firmID).
            WhereIf(filter.Kind != "", "d.kind = %s", filter.Kind),
          Offset: offset,
          Limit: pageSize,
          OrderBy: "d.id",
        })
    reason: kbuilder is the company standard for listings — WhereIf, pagination, JOIN tag support.

  - id: ed-insert-with-ksql-not-raw-sql
    topic: Repository
    severity: nit
    lintable: false
    sources: ["agent-improvements#25", be-033]
    principle: >
      Prefer `db.Insert()` with a named table struct and `ksql.NewTable(...)` rather than
      hand-written Exec/INSERT and manual JSON marshalling. Reuse the existing table
      struct if one exists.
    reason: >
      KSQL maps struct fields and JSON tags; a NewTable declaration lets the generated
      id be ignored while a unique key participates. Check unique-violation by error
      string instead of custom SQL.

  - id: ed-domain-error-constructors
    topic: Errors
    severity: nit
    lintable: false
    sources: [be-002, be-009]
    principle: >
      Domain errors use the `core` constructors: `core.NotFoundErr`, `core.BadRequestErr`,
      `core.InternalErr`, etc.
    reason: House naming for the domain-error pattern (the principle is in go-adapters-return-domain-errors).

  - id: ed-error-titles-greppable
    topic: Errors
    severity: blocker
    lintable: false
    sources: ["user-2026-09-19 (PR empresa-digital#612)"]
    principle: >
      Domain-error and log titles are always simple hard-coded strings — no fmt verbs,
      no interpolation, no long prose or idiomatic expressions — carrying enough of the
      surrounding context to be descriptive and unique, so a single grep for the title
      finds exactly the origin of the error or log. Dynamic values go in the structured
      payload (the map argument), never in the title.
    wrong:
      code: |
        return core.InternalErr(fmt.Sprintf("failed to roll back issuance of report %d", id), nil)
        return core.InternalErr("CRITICAL: the rollback also failed, so the claim is standing without a PDF behind it — manual attention required", data)
    right:
      code: |
        return core.InternalErr("error rolling back issued status on PDF", map[string]any{
          "reportId": id, "uploadErr": upErr, "rollbackErr": rbErr,
        })
    reason: >
      A title with interpolated values or free prose cannot be grepped back to its source;
      a unique hard-coded string can. Alarm language ("manual attention required") is
      redundant here: every untreated InternalErr already notifies the devs — company
      policy — so the title only needs to identify the failure site.

  - id: ed-max-open-conns
    topic: Config
    severity: blocker
    lintable: false
    sources: [be-017, db-004]
    principle: Configure `MaxOpenConns` above the default of 1 when constructing the DB for production.
    wrong:
      code: |
        db, err := kpgx.New(ctx, dbURL, ksql.Config{})
    right:
      code: |
        db, err := kpgx.New(ctx, dbURL, ksql.Config{MaxOpenConns: 10})
    reason: >
      The default of 1 is fine for tests but a bottleneck in production. Don't hardcode a
      magic number blindly — pick a value to fit the workload (often via config); the 10
      above is just a reasonable starting point.

  - id: ed-storage-path-by-context
    topic: Storage
    severity: blocker
    lintable: false
    sources: [be-023]
    principle: >
      In object/KV stores with a shared key namespace (S3, Redis), identify objects by a
      fully-qualified key, not the bare file ID.
    wrong:
      code: |
        storage.GetUploadURL(ctx, uploadID, opts)
    right:
      code: |
        path := "firms/" + strconv.Itoa(firmID) + "/documents/" + uploadID
        storage.GetUploadURL(ctx, path, opts)
    reason: >
      Avoids future collisions, eases storage navigation, and enables bulk deletion
      (useful for LGPD).

  - id: ed-namespace-imports
    topic: Imports
    severity: nit
    lintable: false
    sources: [fe-010]
    principle: >
      Import a local module as a namespace (`import * as x`) and call through it, rather
      than destructuring named exports. House style, Go-flavored.
    wrong:
      code: |
        import { format, parse } from './currencies'
        format(value)
    right:
      code: |
        import * as currencies from './currencies'
        currencies.format(value)
    reason: >
      The package prefix on each call reads as inline documentation and avoids name
      clashes. This is an empresa-digital house preference — most JS shops prefer named
      imports, so it does not travel and stays in the org profile.

  - id: ed-default-branch-master
    topic: Git
    severity: nit
    lintable: false
    sources: [vini-style]
    principle: >
      The default branch is always `master`, never `main`. New repos set
      `init.defaultBranch = master`; every command, CI config, and doc that names the
      default branch uses `master`.
    wrong:
      code: |
        git checkout main && git pull        # default branch is master here
        git push -u origin main
        # .github/workflows: on: { push: { branches: [main] } }
    right:
      code: |
        git checkout master && git pull
        git push -u origin master
        # .github/workflows: on: { push: { branches: [master] } }
    reason: >
      empresa-digital standardizes on `master`. The portable rules in packs/git.yaml name
      the default branch directly; this org rule pins that name so commands and CI never
      split between `master` and `main`.

  - id: ed-use-testtools-helpers
    topic: Testing
    severity: nit
    lintable: false
    sources: [be-006, be-010, be-012]
    principle: >
      Use the house test stack: `tt.Fake[T]` to build fixtures, `tt.AssertEqual` /
      `tt.AssertNoErr` / `tt.AssertContainsErr` for assertions, and `startAPI` to boot
      the real app in integration tests.
    wrong:
      code: |
        firm := Firm{ID: 1, Name: "Test"}        // hand-built fixture
        assert.NoError(t, err)                    // third-party assert
        mux := http.NewServeMux()                 // hand-built router
    right:
      code: |
        firm := tt.Fake[Firm](t, customValues)
        tt.AssertNoErr(t, err)
        startAPI(ctx, cfg)
    reason: >
      tt and startAPI are empresa-digital's own helpers; the portable principles
      (data-driven tests, real-app integration) live in packs/testing.yaml while these
      tool names stay in the org profile.

  - id: ed-wrap-multi-clause-sql
    topic: SQL
    severity: nit
    lintable: true
    sources: [vini-style]
    principle: >
      A single-line query that packs more than one clause (FROM + JOIN + WHERE, or
      several conditions) and runs past ~80 chars must wrap by clause: each JOIN and
      WHERE on its own line, with the ON and any trailing AND moved to the line below
      and indented. A line carrying a SINGLE clause may exceed 80 (e.g. a long json
      projection with verbose column names) and is left alone — never an unfixable nit.
    wrong:
      code: |
        SELECT d.* FROM diligence d LEFT JOIN firm_users fu ON fu.firm_id = d.firm_id AND fu.user_id = $1 WHERE d.status = 'open' AND d.firm_id = $2
    right:
      code: |
        SELECT d.*
        FROM diligence d
        LEFT JOIN firm_users fu
          ON fu.firm_id = d.firm_id
          AND fu.user_id = $1
        WHERE d.status = 'open'
          AND d.firm_id = $2
    reason: >
      A long multi-clause query on one physical line is unscannable and produces noisy
      diffs. Wrapping by clause — ON and AND dropped below their JOIN/WHERE — puts each
      condition on its own reviewable line. The single-clause exemption means a long
      json_build_object or column list with long names never trips a nit you can't fix.
      This is an empresa-digital house formatting preference; other shops wrap SQL
      differently, so it stays in the org profile, not packs/database.yaml.

  - id: ed-prefer-plain-sql-for-static-queries
    topic: Repository
    severity: nit
    lintable: false
    sources: ["pr-review#381,383,436"]
    principle: >
      Reserve `kbuilder` for queries whose shape varies at runtime (conditional filters,
      pagination). For a fixed, static query, write plain SQL with `db.Query`/`db.Exec`.
    wrong:
      description: kbuilder used for a constant query with no runtime-varying parts.
      code: |
        err = c.db.QueryFromBuilder(ctx, &rows, kbuilder.Query{
          From:  "diligence_parties dp JOIN parties p ON p.id = dp.party_id",
          Where: kbuilder.Where("dp.diligence_id = %s", diligenceID),
          OrderBy: "p.id",
        })
    right:
      description: Plain SQL — the query has no dynamic parts.
      code: |
        err = c.db.Query(ctx, &rows,
          `FROM diligence_parties dp
          JOIN parties p
            ON p.id = dp.party_id
          WHERE dp.diligence_id = $1
          ORDER BY p.id`, diligenceID)
    reason: >
      kbuilder earns its keep on LIST endpoints with conditional WhereIf + pagination
      (see ed-list-funcs-use-kbuilder-and-pagination). For a query with no
      runtime-varying parts it is "a cannon to kill a fly" — plain SQL is shorter and
      reads more directly. This complements the list-funcs rule, it does not contradict it.

  - id: ed-handler-response-explicit-dto
    topic: Boundaries
    severity: nit
    lintable: true
    sources: ["agent-improvements#31"]
    principle: >
      Handlers never pass a domain entity (or a slice of entities) straight to
      `c.JSON`. Build the response explicitly in the handler — a `map[string]any`
      (or a slice of maps) naming every field the endpoint returns — even when the
      entity's json tags would serialize to the same shape today.
    wrong:
      description: >
        Serialize the domain entity directly; the API contract is implicit in
        whatever the entity happens to contain.
      code: |
        templates, err := d.repo.ListDiligenceTemplates(ctx, filter)
        // ...
        return c.JSON(templates)
    right:
      description: Translate to an explicit response shape at the handler.
      code: |
        responseDto := []map[string]any{}
        for _, t := range templates {
            responseDto = append(responseDto, map[string]any{
                "id":       t.ID,
                "name":     t.Name,
                "sections": t.Sections,
            })
        }
        return c.JSON(responseDto)
    reason: >
      With `c.JSON(entity)` the API contract is whatever the entity happens to be:
      renaming an entity field or adding a sensitive attribute silently changes or
      leaks through every endpoint that serializes it. The explicit map pins the
      contract in the handler, so entity churn cannot alter a response unnoticed —
      the same protection the inbound side already gets from its inline payload DTOs.
      This tightens `u-translate-at-external-boundaries` for this org: translation is
      mandatory even when nothing sensitive leaks today. The existing controllers
      still contain many direct `c.JSON(entity)` calls; that legacy does NOT bless
      the pattern — on this specific point this rule overrides
      `u-follow-local-convention`, and new or modified handlers must translate.
